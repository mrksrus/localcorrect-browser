<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
<body>
  <h1>LocalCorrect</h1>
  <label for="language">Text language</label>
  <select id="language">
    <option value="auto">Detect automatically</option>
    <option value="en">English</option>
    <option value="de">Deutsch</option>
  </select>
  <div class="buttons">
    <button id="correct" type="button">Correct</button>
    <button id="undo" type="button">Undo</button>
  </div>
  <p id="status" role="status"></p>
  <p class="hint">Shortcuts: <kbd>Alt+Shift+C</kbd> correct, <kbd>Alt+Shift+Z</kbd> undo.
    Change them in about:addons → ⚙ → Manage Extension Shortcuts. Runs offline.</p>
  <script src="popup.js" type="module"></script>
</body>
</html>
